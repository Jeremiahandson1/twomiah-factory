services:
  # ─── Factory API ──────────────────────────────────────────────────────────────
  - type: web
    name: twomiah-factory-api
    runtime: node
    plan: starter
    buildCommand: cd apps/api && bun install
    startCommand: cd apps/api && bun run start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_ORG
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_OWNER_ID
        sync: false
      - key: PLATFORM_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_FACTORY_WEBHOOK_SECRET
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: PORT
        value: "3001"

  # ─── Factory Platform (React SPA) ────────────────────────────────────────────
  - type: web
    name: twomiah-factory-platform
    runtime: node
    plan: starter
    buildCommand: cd apps/platform && bun install && bun run build && npm install -g serve
    startCommand: cd apps/platform && npx serve dist -s -l $PORT
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_GOOGLE_MAPS_KEY
        sync: false
      - key: PORT
        value: "3000"

  # ─── Daily Lifecycle Cron ────────────────────────────────────────────────────
  # Trial warnings, 60/30/7-day domain + subscription renewal warnings, offboard
  # teardown pickup and preview follow-ups. These endpoints were written to be
  # "run daily by an external scheduler" that never existed, so none of it fired.
  - type: cron
    name: twomiah-factory-daily
    runtime: node
    schedule: "0 13 * * *"   # 08:00 US Central, once a day
    buildCommand: cd apps/api && bun install
    startCommand: cd apps/api && bun run src/cron/daily.ts
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: twomiah-factory-api
          property: hostport
      - key: CRON_SECRET
        fromService:
          type: web
          name: twomiah-factory-api
          envVarKey: CRON_SECRET

  # ─── Weekly Regression Cron ──────────────────────────────────────────────────
  # Runs the factory test matrix (smoke, generate-only, no AI compose) so
  # template/generator breakage is found by us on a Sunday rather than by a
  # customer's deploy on a Tuesday. Creates no Render services and spends no
  # Anthropic credits; every test tenant it makes, it deletes.
  # Tenant databases live in Ohio (deploy.ts defaults) while the API lives in
  # Oregon, and a database is only reachable from inside its own region. This
  # runner exists so Ohio databases get backed up at all — the Oregon sweep in
  # the daily cron cannot reach them.
  - type: cron
    name: twomiah-factory-backup-ohio
    runtime: node
    region: ohio
    plan: starter
    schedule: "0 13 * * *"   # 08:00 US Central, alongside the daily sweep
    buildCommand: cd apps/api && bun install
    startCommand: cd apps/api && bun run src/cron/backup.ts

  - type: cron
    name: twomiah-factory-regression
    runtime: node
    schedule: "0 14 * * 0"   # Sundays, 09:00 US Central
    buildCommand: cd apps/api && bun install
    startCommand: cd apps/api && bun run src/cron/regression.ts
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FACTORY_FROM_EMAIL
        sync: false
      - key: STAFF_NOTIFY_EMAIL
        sync: false

  # ─── Cleanup Cron Job ────────────────────────────────────────────────────────
  - type: cron
    name: twomiah-factory-cleanup
    runtime: node
    schedule: "0 * * * *"
    buildCommand: cd apps/api && bun install
    startCommand: cd apps/api && bun run src/cron/cleanup.ts
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: twomiah-factory-api
          property: hostport
      - key: CRON_SECRET
        fromService:
          type: web
          name: twomiah-factory-api
          envVarKey: CRON_SECRET
