<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{COMPANY_NAME}} content management — admin dashboard.">
  <meta name="keywords" content="{{COMPANY_NAME}}, {{CITY}}, {{STATE_FULL}}, admin, content management">
  <meta name="author" content="{{COMPANY_NAME}}">
  <meta name="robots" content="noindex, nofollow">

  <title>{{CITY}} {{INDUSTRY}} | {{COMPANY_NAME}}</title>
  
  <!-- Favicon: the tenant's generated SVG (served by the site at /favicon.svg);
       refined from site settings after login. No .ico/.png — those were a
       per-client asset leak and are no longer shipped. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" id="dynamic-favicon">
  <script>
    // After login, prefer the favicon set in site settings (if the tenant uploaded one)
    (function() {
      var token = localStorage.getItem('adminToken');
      if (!token) return;
      fetch('/admin/site-settings', { headers: { 'Authorization': 'Bearer ' + token } })
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(s) {
          var fav = s && (s.favicon || s.logo);
          var el = document.getElementById('dynamic-favicon');
          if (fav && el) el.href = fav;
        })
        .catch(function() {});
    })();
  </script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Open Graph -->
  <meta property="og:title" content="{{CITY}} {{INDUSTRY}} | {{COMPANY_NAME}}">
  <meta property="og:description" content="Transform your home with quality roofing, siding, and windows. Free estimates. Serving {{CITY}} and the {{SERVICE_REGION}}.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{SITE_URL}}">
  <meta property="og:image" content="/logo.jpg">
  
  <!-- Schema.org is injected dynamically per page for richer structured data -->
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
