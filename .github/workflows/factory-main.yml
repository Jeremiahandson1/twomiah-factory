name: Factory tests (main)

# The Factory's own tests (tests/unified/factory/*.test.ts), on every pull request into main and every push to it. They ran only
# for the engine branch (unified.yml), so a pull request into main could show every check green with none of them run: 11/07,
# #254 shipped the test for the slideshow's frame without the frame, and nothing failed. This is the same job unified.yml runs
# for engine, unchanged.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  factory:
    name: Factory — the Factory's tests (the Web presence plan, domains, deploy, routes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pgpass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      UNIFIED_TEST_PG: postgres://postgres:pgpass@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install
      - name: A test signup, built, updated and torn down
        run: bun test --timeout 900000 tests/unified/factory/build.test.ts
      # One process for all of them: a stand-in for the sign-in module or for fetch is installed only through
      # tests/unified/factory/stubs.ts, which puts the real one back when its file ends (no-leaking-stubs.test.ts guards it).
      - name: The Factory's unified path, the Web presence plan, and every handler reading the tenant columns it selected
        run: bun test --timeout 300000 $(ls tests/unified/factory/*.test.ts | grep -v build.test.ts)
