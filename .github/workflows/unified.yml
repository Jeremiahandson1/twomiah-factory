name: Unified app

# The unified app's own checks (docs/RULEBOOK.md), on every push to the engine branch. A push that breaks a rule,
# reaches outside the fence, adds a type error, fails a test or breaks the admin build does not pass.

on:
  push:
    branches: [engine]
  pull_request:
    branches: [engine]

permissions:
  contents: read

jobs:
  unified:
    name: rulebook, fence, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The fence compares the branch with where it left main, so it needs main's history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install
      - name: Fence — the live system is not touched (RULEBOOK §10)
        run: bun run scripts/check-unified-fence.ts origin/main
      - name: Rulebook checks (RULEBOOK §1–§8)
        run: bun run scripts/check-unified-rules.ts
      - name: Types — none in the unified app; shared packages not above their baseline
        run: bun run scripts/check-unified-types.ts
      - name: Tests — boot, rule mutations, fence
        working-directory: apps/unified
        run: bun test tests
      - name: Admin screens build
        working-directory: apps/unified
        run: bun run build:web

  # The step-3 measure (SPEC §0): the base CRM's own behaviour suite, unchanged, against the unified app. A file passes,
  # or every assertion it fails is a documented divergence (tests/unified/harness/unified-divergences.ts) whose
  # behaviour is held elsewhere — the six reply-shape ones by their adapted copies, run after it.
  crm-suite:
    name: base CRM suite on the unified app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install
      - name: Base CRM suite (tests/crm) on the unified app
        run: bun tests/unified/harness/crm.ts
      - name: Adapted copies (tests/unified/crm)
        run: bun tests/unified/crm/harness/run.ts
