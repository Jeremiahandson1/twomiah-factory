name: Unified app

# The unified app's own checks (docs/RULEBOOK.md), on every push to the engine branch. A push that breaks a rule,
# reaches outside the fence, adds a type error or fails a test does not pass.

on:
  push:
    branches: [engine]
  pull_request:
    branches: [engine]

permissions:
  contents: read

jobs:
  unified:
    name: rulebook, fence, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The fence compares the branch with where it left main, so it needs main's history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install
      - name: Fence — the live system is not touched (RULEBOOK §10)
        run: bun run scripts/check-unified-fence.ts origin/main
      - name: Rulebook checks (RULEBOOK §1–§8)
        run: bun run scripts/check-unified-rules.ts
      - name: Types — none in the unified app; shared packages not above their baseline
        run: bun run scripts/check-unified-types.ts
      - name: Tests — boot, rule mutations, fence
        working-directory: apps/unified
        run: bun test tests
