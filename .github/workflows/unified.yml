name: Unified app

# The unified app's own checks (docs/RULEBOOK.md), on every push to the engine branch. A push that breaks a rule,
# reaches outside the fence, adds a type error, fails a test or breaks the admin build does not pass.

on:
  push:
    branches: [engine]
  pull_request:
    branches: [engine]

permissions:
  contents: read

jobs:
  unified:
    name: rulebook, fence, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The fence compares the branch with where it left main, so it needs main's history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install
      - name: Fence — the live system is not touched (RULEBOOK §10)
        run: bun run scripts/check-unified-fence.ts origin/main
      - name: Rulebook checks (RULEBOOK §1–§8)
        run: bun run scripts/check-unified-rules.ts
      - name: No browser dialogs in the unified screens
        run: bun run scripts/check-unified-no-native-dialogs.ts
      - name: Stored moments print on the company clock in the admin screens
        run: bun run scripts/check-unified-instants-on-company-clock.ts
      - name: Whole lists answer through listAll (the limit asked for, never a made-up 1)
        run: bun run scripts/check-unified-whole-lists.ts
      - name: Screen state that is set is also read (no dead buttons)
        run: bun run scripts/check-unified-dead-state.ts
      - name: Money prints its sign before the "$" (one formatter)
        run: bun run scripts/check-unified-money-sign.ts
      - name: A stored code (status, stage, type…) is shown in words, never as stored
        run: bun run scripts/check-unified-raw-codes.ts
      - name: Every feature an industry is offered has a screen in its app
        run: bun run scripts/check-unified-feature-has-screen.ts
      - name: Every Delete is gated where it is drawn; every writing screen asks a permission
        run: bun run scripts/check-unified-write-controls.ts
      - name: Export everything covers every table, for one business, with no secrets
        run: bun run scripts/check-unified-export-everything.ts
      - name: Types — none in the unified app; shared packages not above their baseline
        run: bun run scripts/check-unified-types.ts
      - name: Admin screens build
        working-directory: apps/unified
        run: bun run build:web
      # The phone app (apps/mobile, changed with the unified app — the fence's note on it): what the stores check before a person does
      # (artwork, the store app's permission texts, eas.json's owner placeholders, store/listing.md), and where background location is on.
      - name: Phone app — store readiness, location settings, every screen address resolves, nothing under the system bars, stat cards keep their width, text is readable
        run: |
          bun run tests/mobile/store-ready.test.ts
          bun run tests/mobile/location-tracking.test.ts
          bun run tests/mobile/routes-resolve.test.ts
          bun run tests/mobile/edge-insets.test.ts
          bun run tests/mobile/dashboard-stat-cards.test.ts
          bun run tests/mobile/theme-contrast.test.ts
          bun run tests/mobile/parity-map.test.ts
          bun run tests/mobile/design-tokens.test.ts
          bun run tests/mobile/design-preview.test.ts
          bun run tests/mobile/design-preview-dev-only.test.ts
          bun run tests/mobile/more-menu.test.ts
          bun run tests/mobile/home-routes.test.ts

  # The app's own test files, split across parallel runners (runEach.ts SHARD=i/n): every file runs exactly once, each
  # in its own process, and any failing shard fails the push. One runner took ~40 min; six take a fraction (10/24).
  unified-tests:
    name: Tests — shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install
      - name: Tests — boot, rule mutations, fence
        working-directory: apps/unified
        env:
          SHARD: ${{ matrix.shard }}/6
        run: bun run test

  # The Factory's side (apps/api/src/unified): a test signup built with its own database server, repo and service,
  # then updated and torn down: the tenant repo installed from its lockfile, built, migrated, served and provisioned.
  factory:
    name: Factory — a test signup built, updated and torn down end to end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pgpass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      UNIFIED_TEST_PG: postgres://postgres:pgpass@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install
      - name: A test signup, built, updated and torn down
        run: bun test --timeout 900000 tests/unified/factory/build.test.ts
      # The Factory's other unified pieces — the deploy, domains, the CRM add-on, site addresses, teardown, names, the
      # tree, routes, provisioning — and the tenant-select guard. They ran only by hand until 2026-10-20.
      - name: The Factory's unified path, and every handler reading the tenant columns it selected
        run: bun test --timeout 300000 $(ls tests/unified/factory/*.test.ts | grep -v build.test.ts)

  # The step-3 measure (SPEC §0): the base CRM's own behaviour suite, unchanged, against the unified app. A file passes,
  # or every assertion it fails is a documented divergence (tests/unified/harness/unified-divergences.ts) whose
  # behaviour is held elsewhere — the six reply-shape ones by their adapted copies, run after it.
  # Each suite on its own runner, in parallel (10/24: one runner ran all eleven in a row, ~32 min).
  crm-suite:
    name: CRM suites on the unified app — ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [crm, fieldservice, basic, landscaping, restaurant, bar, rv, salon, vet, homecare, adapted]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install
      - name: The ${{ matrix.suite }} suite on the unified app
        run: bun tests/unified/harness/${{ matrix.suite }}.ts
