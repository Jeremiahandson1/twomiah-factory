name: Security scan

on:
  pull_request:
    branches: [main]
  push:
    # engine too: the release (wait-ci.ts) waits for this scan before it merges engine into main (2026-10-26).
    branches: [main, engine]
  schedule:
    # Re-scan main weekly so newly-published CVEs against pinned deps
    # show up even when no code changed.
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  bun-audit:
    name: bun audit (high+critical fail build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      # Audit PRODUCTION dependencies only (--prod). The dev/build toolchain
      # (vite, babel, eslint, postcss, browserslist, picomatch, …) is never in the
      # deployed artifact, and its transitive advisories can only be cleared by
      # breaking major bumps of build tools — noise that would keep this gate
      # permanently red. Auditing what actually ships keeps the gate meaningful so
      # a real production-dependency regression stands out.
      # apps/unified joined the audit when puppeteer went 23 -> 25 (2026-10-28), which removed the last two findings it had (a
      # transitive zod 3 that no 3.x release fixes, and extract-zip): it is clean, so there is no exception and nothing is
      # ignored. A new finding in it fails this job like any other.
      - name: Audit factory + platform + unified deps
        run: |
          set -e
          for dir in apps/api apps/platform apps/unified; do
            echo "::group::bun audit $dir"
            (cd "$dir" && bun install --frozen-lockfile && bun audit --prod --audit-level=high) || exit 1
            echo "::endgroup::"
          done
      # The phone app (10/31: never audited until now; 6 findings, the critical shell-quote and postcss fixed by root
      # overrides — docs/SECURITY_UPGRADES.json). Three are excepted BY ID, each for a stated reason; any other finding fails:
      #   GHSA-qr28-fpjm-wq7f decode-uri-component — fixed only in 0.5.1, which is ESM-only; React Navigation's query-string
      #     require()s it, so the override would break link handling at run time. The risk is a slow parse of a crafted link
      #     opened in the app itself.
      #   GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr image-size — fixed only in 2.x (a new API); metro uses 1.x at BUILD time
      #     on the app's own images, so no outside file reaches it.
      # Remove each exception when React Native / Expo ships the fixed version.
      - name: Audit the phone app
        run: |
          cd apps/mobile && bun audit --prod --audit-level=high --ignore=GHSA-qr28-fpjm-wq7f --ignore=GHSA-5p2g-fcmc-qvqq --ignore=GHSA-w3rx-r6r6-pgpr
      - name: Audit each premium template
        run: |
          set -e
          for d in templates/website-premium-*; do
            if [ -f "$d/package.json" ]; then
              echo "::group::bun audit $d"
              (cd "$d" && bun install && bun audit --prod --audit-level=high) || exit 1
              echo "::endgroup::"
            fi
            if [ -f "$d/admin/package.json" ]; then
              echo "::group::bun audit $d/admin"
              (cd "$d/admin" && bun install && bun audit --prod --audit-level=high) || exit 1
              echo "::endgroup::"
            fi
          done

  semgrep:
    name: Semgrep static analysis
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          semgrep \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/secrets \
            --exclude '**/node_modules/**' \
            --exclude '**/dist/**' \
            --exclude '**/build/**' \
            --error \
            --severity ERROR
