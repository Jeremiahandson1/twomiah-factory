name: Build check

# Runs the same build the deploy pipeline runs. Tonight (2026-06-06) a
# tsc unused-var error in apps/platform silently failed every Render
# deploy for hours — Render's API only surfaces "Exited with status 2"
# without log detail. Catching this in CI surfaces the actual error
# message at push time instead of after a failed deploy.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-api:
    name: apps/api — bun build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install + build
        working-directory: apps/api
        run: |
          bun install --frozen-lockfile
          bun run build

  build-platform:
    name: apps/platform — tsc + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install + build
        working-directory: apps/platform
        run: |
          bun install --frozen-lockfile
          bun run build

  feature-vocabulary:
    name: feature registry — one vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Every feature id a template gates on must exist in packages/tenant-backend/src/featureRegistry.ts
        run: bun run scripts/check-feature-vocabulary.ts

  permission-vocabulary:
    name: permissions — every gated resource is in the role matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Every resource gated in a route must be granted to a role in BASE_ROLE_PERMISSIONS (or owner-only by design)
        run: bun run scripts/check-permission-vocabulary.ts

  shared-deps:
    name: shared packages — deps declared by every template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Every bare import in packages/tenant-ui + tenant-backend is in the package.json of every template that vendors them
        run: bun run scripts/check-shared-deps.ts

  money-model:
    name: invoice refund model — both halves hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: A refunded deposit reopens the balance; a refund on a fully-paid invoice never creates one
        run: bun run scripts/check-money-model.ts

  appointment-guards:
    name: scheduling — double-book writes atomic, cancel keeps history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: salon/vet/restaurant conflict check+write is transactional and cancel is a soft status
        run: bun run scripts/check-appointment-guards.ts

  kiosk-tenant-isolation:
    name: dispensary kiosk resolves its own company, never an arbitrary row
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: kiosk company is scoped to the owner account, not `company LIMIT 1`
        run: bun run scripts/check-kiosk-tenant-isolation.ts

  assignee-source:
    name: jobs assignee picker resolves login users, not the roster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: the "Assigned To" picker reads /api/team/assignable (login users)
        run: bun run scripts/check-assignee-source.ts

  company-settings-merge:
    name: PUT /api/company merges settings, never replaces the blob
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: a partial settings write can't wipe plan/seat-limit/terms/onboarding
        run: bun run scripts/check-company-settings-merge.ts

  lead-inbox-theme:
    name: Lead Inbox + Lead Sources stay dark-mode safe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: inline-styled lead pages must colour from useLeadPalette(), never hardcode a light palette
        run: bun run scripts/check-lead-inbox-theme.ts

  booking-availability:
    name: Booking slot list matches the validator (grid + window)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: /slots must step by the advertised grid and honour the booking window
        run: bun run scripts/check-booking-availability.ts

  settings-money-validation:
    name: Settings tax/terms are validated, not silently clamped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: a bad tax rate / term must be refused, never coerced to a default that wipes the stored value
        run: bun run scripts/check-settings-money-validation.ts

  job-doublebook:
    name: Job conflict check is atomic (no double-booking race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: the same-tech/slot check + write must share one transaction under the job lock
        run: bun run scripts/check-job-doublebook.ts

  jobs-input:
    name: Job status/time are validated (no junk buckets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: status is a bounded enum and scheduledTime is HH:MM
        run: bun run scripts/check-jobs-input.ts

  lineitem-nonneg:
    name: Line-item quantity/price clamp to >= 0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: quantity + unit price must clamp at the input so display == payload
        run: bun run scripts/check-lineitem-nonneg.ts

  invoice-datewindow:
    name: Invoice due date validated vs issue date (create + update)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: due >= issue on both paths; issue date settable; no today-based guard
        run: bun run scripts/check-invoice-datewindow.ts

  contact-dup-update:
    name: Contact duplicate check runs on update too
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: editing email/phone to another contact's is caught (excluding self)
        run: bun run scripts/check-contact-dup-update.ts

  document-fidelity:
    name: Documents keep original bytes; PDFs preview inline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: no main-file transcode; row records stored bytes; PDF served inline
        run: bun run scripts/check-document-fidelity.ts

  roof-ai-receptionist-read:
    name: Roof AI Receptionist reads its list envelopes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: rules/calls unwrap { data }; updateRule sets only editable columns
        run: bun run scripts/check-roof-ai-receptionist-read.ts

  events-nonneg:
    name: Events catalog and edits refuse negative money
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: spaces/packages POST+PUT, menu-line/payment PUT, CSV import refuse negatives
        run: bun run scripts/check-events-nonneg.ts

  events-local-dates:
    name: Events pages show local calendar days
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: no toISOString() day-slicing; paid badge + overdue use localDay()
        run: bun run scripts/check-events-local-dates.ts

  events-ledger:
    name: Events money lives on the invoice (one ledger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: schedule-only event_payment; shared invoice writes; dashboard == Reports; due-date hooks
        run: bun run scripts/check-events-ledger.ts

  shared-stripe:
    name: Stripe has one implementation (7 CRMs are glue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: services/routes stripe.ts are glue over packages/tenant-backend payments/stripe.ts
        run: bun run scripts/check-shared-stripe.ts

  shared-bulk:
    name: Bulk operations have one implementation (7 CRMs are glue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: services/bulk.ts is glue over packages/tenant-backend bulk/bulk.ts
        run: bun run scripts/check-shared-bulk.ts

  portal-payment-init:
    name: Portal card payments can initialise Stripe.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: payment/setup intents return publishableKey; portal forwards stripeAccount to loadStripe
        run: bun run scripts/check-portal-payment-init.ts

  connect-charging:
    name: Connect businesses are charged on their own account
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: every Stripe money call scoped; /factory-event; Factory connect-webhook + registration + schema
        run: bun run scripts/check-connect-charging.ts

  webhook-payment-core:
    name: Route and Stripe webhook record money through one core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: recordInvoicePayment is locked, refund-aware, idempotent; webhook has no own math
        run: bun run scripts/check-webhook-payment-core.ts

  stripe-refunds:
    name: Stripe refunds record through the shared refund core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: recordInvoiceRefund shared by route + owner refund + charge.refunded; endpoints subscribed
        run: bun run scripts/check-stripe-refunds.ts

  checkout-recording:
    name: Checkout / Payment Link payments reach the invoice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: intents carry invoice_id via payment_intent_data; charges use the refund-aware balance; no inv.balance
        run: bun run scripts/check-checkout-recording.ts

  booking-deposit-confirms-job:
    name: A cleared booking deposit schedules the pending job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: webhook mirrors the confirm onto the job (pending → scheduled), same mapping as a manual confirm
        run: bun run scripts/check-booking-deposit-confirms-job.ts

  bulk-markpaid:
    name: Bulk mark-paid writes payment rows through the payment core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: bulkMarkInvoicesPaid records the refund-aware balance via recordInvoicePayment; glue passes payment
        run: bun run scripts/check-bulk-markpaid.ts

  sms-send-contract:
    name: Messages form and POST /api/sms/send agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: every text sender posts { contactId | toPhone, message }; no { to, body }
        run: bun run scripts/check-sms-send-contract.ts

  events-input:
    name: Events form, edit and CSV import share one validator + booking write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: validateEventInput + createEvent (lock, clash) used by POST/PUT/import; status/type lists == UI
        run: bun run scripts/check-events-input.ts

  events-retire-guard:
    name: Rooms / packages in use by upcoming bookings cannot be retired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: DELETE + PUT {active:false} answer 409 with the count; UI shows the reason
        run: bun run scripts/check-events-retire-guard.ts

  enabled-feature-gates:
    name: Switched-off modules are refused at the API (one shared gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: shared createEnabledFeatureGate (id or any-of list); every CRM gates its sidebar-gated families at the mount + email marketing in-route; processor + sidebar honour the switch; cross-module lookups tolerant
        run: bun run scripts/check-enabled-feature-gates.ts

  events-booking-rules:
    name: Events booking rules (deposit books the date, package floor, one Team list, warn-and-ask)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: onPayment hook in the shared payment core; bookOnDeposit on both money paths; packageFloor on add + edit; merged Team list; coordinator = login user; confirmEventRisks in both forms
        run: bun run scripts/check-events-booking-rules.ts

  ui-consistency:
    name: UI consistency (search at every width, readable Help page, brand colour, unique feature names)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: header search button not hidden below md; Help headings/body readable and identical across templates; no hard-coded teal on events pages; no two features share a name; no trend arrow on a rate
        run: bun run scripts/check-ui-consistency.ts

  invoice-credit:
    name: Invoice credit (a refund returns money, a credit lowers the price)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: applyInvoiceCredit locked, capped at what is owed, re-totalled, recorded, no money moved; POST /:id/credit; Apply credit on the invoice page with a matching preview
        run: bun run scripts/check-invoice-credit.ts

  search-feature-gates:
    name: Search shows only what the tenant can open (in step with the API gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: each CRM's search TYPE_FEATURES agrees with index.ts (gated → same features, unmounted → hidden); search, quick search, Recent and ?types= filtered
        run: bun run scripts/check-search-feature-gates.ts

  rv-sold-unit:
    name: RV sale and unit move together (no unit sold twice or left advertised)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: marking a deal Sold sells its unit in one locked transaction, a sold unit is refused, reopening frees it; pipeline labels + flag; seed
        run: bun run scripts/check-rv-sold-unit.ts

  rv-desked-deal:
    name: RV desked deal is saved once and F&I finances it (one calculation, same rules both sides)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: sales_lead.deal + migration; GET/PUT /:id/deal scoped + validated; Desking saves/reloads via lib/deal; F&I = desked + products; no notes-JSON desk
        run: bun run scripts/check-rv-desked-deal.ts

  inventory-stock-moves:
    name: Inventory stock moves are validated, company-owned and all-or-nothing (crm, field service, landscaping, RV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: adjust/transfer/use/return/receive in one locked transaction via moveStock; quantity validated; item/location scoped; refusals 400/404/409
        run: bun run scripts/check-inventory-stock-moves.ts

  rv-ai-leads-availability:
    name: RV AI Lead Responder never offers a sold/pending unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: unavailable unit → availableNow false + status, no price; instruction forbids offering it; alternatives available-only; inbox/page show status
        run: bun run scripts/check-rv-ai-leads-availability.ts

  rv-ai-responder-send:
    name: RV AI Lead Responder shows Sent only for a real, confirmed text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Send text → POST /api/sms/send (contactId), Sent ✓ only on success, errors shown; email = mailto, no send claim
        run: bun run scripts/check-rv-ai-responder-send.ts

  rv-ai-report-totals:
    name: RV AI Reports totals are precomputed and every table total is re-added before it is shown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: precomputedTotals in the model context + instruction; fixReportTotals corrects wrong Total rows and repeats, with a note; pure helper behaviour on the T19 shape
        run: bun run scripts/check-rv-ai-report-totals.ts

  rv-rentals:
    name: RV rentals are stored, validated and never double-booked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: rental_reservation + migration; no in-memory/made-up rows; server days/total; unit lock + overlap 409; status flow; revenue excludes cancelled; page books a real unit
        run: bun run scripts/check-rv-rentals.ts

  rv-adf-import:
    name: RV ADF import takes only real ADF leads and doesn't duplicate a resent lead
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: adf+prospect+customer identity required (400); fields from <customer>; advisory identity lock; open recent same-interest lead returned as duplicate
        run: bun run scripts/check-rv-adf-import.ts

  rv-unit-validation:
    name: RV units need a real identity, edits are validated, the public feed lists available units only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: category enum, stock/year/make/model required, VIN format; PUT parses unitUpdateSchema; pricing warnings; LISTABLE = available; pending only on explicit export
        run: bun run scripts/check-rv-unit-validation.ts

  rv-lead-rules:
    name: RV sales leads have a real stage, company-owned references and no open duplicates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: "leadRefusal in create/edit tx before writes — stage enum 400; contact/unit/salesperson company-scoped 404; open duplicate 409 under contact lock"
        run: bun run scripts/check-rv-lead-rules.ts

  rv-repair-orders:
    name: "RV repair orders take real statuses and non-negative amounts; no $0 invoices"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: "roInputError + roRefError before writes on create/edit; closing bills only when total > 0; Service page shows the refusal"
        run: bun run scripts/check-rv-repair-orders.ts

  inventory-items:
    name: "Inventory items need a name and non-negative amounts; edits write only item fields"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: "itemFields validation for create/update; updateItem never writes the raw body; PUT 404 for other companies; form shows refusals"
        run: bun run scripts/check-inventory-items.ts

  rv-search-units:
    name: "RV global search finds inventory units"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: "unit search (stock/VIN/make/model/trim/year) company-scoped, default type, gated on unit_inventory; result opens /crm/units?search="
        run: bun run scripts/check-rv-search-units.ts

  rv-dealer-reports:
    name: "RV Reports shows dealership figures; quote conversion labelled on decided quotes"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: "sales-report endpoint (units sold, gross from desk, close rate, pipeline, service) + dealership mode; quote label approved of decided"
        run: bun run scripts/check-rv-dealer-reports.ts

  rv-deal-jacket:
    name: "RV title & registration for sold deals only; F&I credit apps validated"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: "title-reg loads the company deal, refuses unsold, fee from desk, list scoped; F&I amount/term/products validated before lender submit"
        run: bun run scripts/check-rv-deal-jacket.ts

  rv-parts-orders:
    name: "RV parts orders are priced by the server from the catalog"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: "findCatalogPart per item, catalog price and name, quantity 1-999, per-company list, Order button shows results"
        run: bun run scripts/check-rv-parts-orders.ts

  rv-trade-appraisal:
    name: "RV AI trade appraisal validates year, category and condition before the AI call"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: "year 1900..next year, category and condition from the lists, checked before fetch"
        run: bun run scripts/check-rv-trade-appraisal.ts

  rv-dashboard:
    name: "RV dashboard counts units for sale by category and labels the monthly close rate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: "availableByCategory + closedLostThisMonth in stats; panel and close cell use them"
        run: bun run scripts/check-rv-dashboard.ts

  invoice-min-lines:
    name: "Invoice min line items guard"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
