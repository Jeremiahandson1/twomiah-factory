  function addrAct(path, body, done) {
    addr.busy = true; addr.out = null; render();
    api(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) {
      addr.busy = false;
      if (r.status === 401) return signedOut('Your session ended. Sign in again with a new link.');
      if (!r.ok) addr.out = { bad: true, text: (r.d && r.d.error) || 'That did not work.' };
      else done(r.d);
      render();
    }).catch(function () { addr.busy = false; addr.out = { bad: true, text: 'Could not reach the address service. Try again in a minute.' }; render(); });
  }
  function address() {
    loadAddr();
    var st = addr.status, cards = [];
    var words = !st ? 'Checking…' : st.error ? st.error : st.status === 'unconfigured' ? 'Your page is at the address Twomiah gave it. You can use your own.' :
      st.status === 'active' && st.domain ? (st.domain + ' is live.') :
      st.status === 'pending_site' && st.domain ? (st.domain + ' is set up and is waiting to open' + (st.verifyEmail ? '. Your registrar emailed ' + st.verifyEmail + ' a link to confirm the address: open it.' : '.')) :
      st.status !== 'pending_nameservers' || !st.domain ? 'We could not read the address just now. Try again in a minute.' :
      (st.domain + ' is waiting for its name servers.' + (st.nameservers && st.nameservers.length ? ' At the company you bought it from, set its name servers to: ' + st.nameservers.join(', ') + '.' : ''));
    cards.push(h('div', { class: 'card' }, h('h2', null, 'Your address'), h('p', null, window.location.host), h('p', { class: 'hint' }, words),
      h('p', { class: 'hint' }, 'An address is live only when it really opens. This page says so only then.')));
    if (st && st.status === 'unconfigured') {
      var own = h('input', { type: 'text', maxlength: 100, placeholder: 'yourbusiness.com', 'aria-label': 'A domain you own' });
      cards.push(h('div', { class: 'card' }, h('h2', null, 'Use a domain you own'), h('p', { class: 'hint' }, 'Type it and we will tell you the one setting to change where you bought it.'), own,
        h('button', { class: 'primary', disabled: addr.busy, onclick: function () { addrAct('/api/domain/attach', { domain: own.value }, function (d) { addr.loaded = false; addr.status = null; addr.out = { text: 'Connected. Next, at the company you bought it from, set its name servers to: ' + ((d.nameservers || []).join(', ') || '(shown above in a moment)') + '.' }; loadAddr(); }); } }, 'Connect it')));
      var f = {}; function inp(key, label, ph) { var e = h('input', { type: 'text', maxlength: 100, placeholder: ph || '', 'aria-label': label }); f[key] = e; return h('div', null, h('label', null, label), e); }
      cards.push(h('div', { class: 'card' }, h('h2', null, 'Buy a domain'), h('p', { class: 'hint' }, 'You pay on the next page, and we register it for you. The registrar needs your business address; it is sent only to them.'),
        inp('domain', 'The domain you want', 'yourbusiness.com'), inp('address', 'Street address'), inp('city', 'City'), inp('state', 'State (like WI)'), inp('zip', 'ZIP'), inp('phone', 'Phone'),
        h('button', { class: 'primary', disabled: addr.busy, onclick: function () {
          addrAct('/api/domain/buy', { domain: f.domain.value, registrant: { address: f.address.value, city: f.city.value, state: f.state.value, zip: f.zip.value, phone: f.phone.value } }, function (d) {
            if (d.url && /^https:\/\//.test(d.url)) window.location.href = d.url; else addr.out = { bad: true, text: 'We could not start the payment.' };
          });
        } }, 'Continue to payment')));
    }
    if (addr.out) cards.push(h('p', { class: 'msg ' + (addr.out.bad ? 'bad' : 'good'), role: 'status' }, addr.out.text));
    return h('div', null, cards);
  }

  // ---- shell ----
  function save() {
    var b = document.getElementById('save'); if (b) b.disabled = true;
    api('/api/model', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(state.model) }).then(function (r) {
      if (r.status === 401) return signedOut('Your session ended. Sign in again with a new link.');
      if (!r.ok) { if (b) b.disabled = false; return say(r.d.error || 'Could not save.', true); }
      state.model = r.d.model; state.dirty = false;
      say('Saved. Your page is updated.' + ((r.d.notes && r.d.notes.length) ? ' ' + r.d.notes.join(' ') : ''), false);
    }).catch(function () { if (b) b.disabled = false; say('Could not save. Check your connection and try again.', true); });
  }
  function render() {
    if (!state.model) return;
    var tabs = [['basics', 'Business'], ['sections', 'Page'], ['look', 'Look'], ['forms', 'Forms'], ['address', 'Address']];
    var body = state.tab === 'basics' ? basics() : state.tab === 'look' ? looks() : state.tab === 'forms' ? forms() : state.tab === 'address' ? address() : sections();
    app.textContent = '';
    app.appendChild(h('div', null,
      h('header', { class: 'bar' }, h('h1', null, state.model.business.name || 'Your page'),
        h('a', { class: 'btn', href: '/', target: '_blank', rel: 'noopener' }, 'View page'),
        h('button', { class: 'primary', id: 'save', disabled: !state.dirty, onclick: save }, 'Save'),
        h('button', { onclick: function () { api('/api/signout', { method: 'POST' }).then(function () { signedOut('You are signed out.'); }); } }, 'Sign out')),
      h('main', null,
        state.msg ? h('p', { class: 'msg ' + (state.msg.bad ? 'bad' : 'good'), role: 'status' }, state.msg.text) : null,
        h('nav', { class: 'tabs', 'aria-label': 'Sections of the editor' }, tabs.map(function (t) { return h('button', { 'aria-pressed': state.tab === t[0] ? 'true' : 'false', onclick: function () { state.tab = t[0]; state.msg = null; render(); } }, t[1]); })),
        body)));
  }
  window.addEventListener('beforeunload', function (e) { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });
  start();
})();
</script>
</body>
</html>
