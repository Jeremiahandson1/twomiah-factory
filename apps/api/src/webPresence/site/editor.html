<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Edit your page</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#ffffff; --ink:#14181f; --muted:#4a5565; --line:#cfd5de; --brand:#1f4e79; --brand-ink:#ffffff; --bad:#9b1c1c; --good:#146c2e; --focus:#0b5fff; }

  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header.bar { position:sticky; top:0; z-index:5; display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  header.bar h1 { font-size:18px; margin:0; flex:1 1 auto; }
  main { max-width:860px; margin:0 auto; padding:16px; }
  nav.tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  button, .btn { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 14px; border-radius:8px; min-height:40px; }
  button.primary { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); font-weight:600; }
  button[aria-pressed="true"] { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
  button.link { border:0; background:none; text-decoration:underline; padding:4px 6px; min-height:0; }
  button.danger { color:var(--bad); }
  :focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .card h2, .card h3 { margin:0 0 8px; font-size:17px; }
  label { display:block; font-weight:600; margin:10px 0 4px; }
  .hint { color:var(--muted); font-size:14px; margin:2px 0 6px; font-weight:400; }
  input[type=text], input[type=email], input[type=tel], input[type=url], input[type=date], input[type=time], select, textarea { width:100%; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  textarea { min-height:90px; resize:vertical; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .row > * { flex:1 1 140px; }
  .row.tight > * { flex:0 0 auto; }
  .list-item { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0; background:var(--bg); }
  .msg { padding:10px 12px; border-radius:8px; margin:10px 0; border:1px solid var(--line); background:var(--card); }
  .msg.bad { color:var(--bad); border-color:var(--bad); } .msg.good { color:var(--good); border-color:var(--good); }
  .thumb { max-width:140px; max-height:100px; border-radius:6px; display:block; margin:6px 0; border:1px solid var(--line); }
  .sr { position:absolute; left:-10000px; }
  .center { max-width:520px; margin:12vh auto; padding:0 16px; }
  .small { font-size:14px; color:var(--muted); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
(function () {

  // ---- tiny DOM helper: text only ever goes in as text, never as markup ----

  // ---- sign-in ----

  }

      h('div', { class: 'row' }, h('div', null, h('label', { for: 'np' }, 'New password'), np), h('div', null, h('label', { for: 'np2' }, 'Type it again'), np2)),
      h('p', null, h('button', { type: 'button', onclick: function () {

        if (np.value.length < 10) { pmsg.textContent = 'Use at least 10 characters.'; return; }
