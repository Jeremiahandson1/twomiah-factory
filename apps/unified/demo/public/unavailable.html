<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Not available in the demo</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2937; --muted: #4b5563; --line: #d1d5db; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111827; --fg: #f3f4f6; --muted: #cbd5e1; --line: #374151; } }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  main { max-width: 28rem; border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  h1 { font-size: 1.125rem; margin: 0 0 8px; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Not available in the demo</h1>
  <p>This part needs the real Twomiah server, which the demo does not have. Everything else in the demo works with sample data.</p>
</main>
</body>
</html>
